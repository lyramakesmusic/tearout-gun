[package]
name = "tearout-plug"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "tearout-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = ["nih_plug/standalone", "dep:cpal"]

[dependencies]
tearout-dsp = { path = "../tearout-dsp" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", default-features = false }
crossbeam-channel = "0.5"
serde_json = "1"
cpal = { version = "0.15", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff", "flac", "pcm", "mp3"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6" }
cocoa = "0.24"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Ole", "Win32_System_Com", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
