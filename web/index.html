<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gun Synth</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23ff7a1a%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #111213; --bg2: #18191b; --bg3: #222326; --ink: #d9dadc; --dim: #85878c; --faint: #4a4c50;
    --acc: #ff7a1a; --ref: #59a8ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.3 system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
  button, select { font: inherit; color: var(--ink); background: var(--bg3); border: 0; border-radius: 4px; padding: 7px 12px; cursor: pointer; }
  select { padding-right: 30px; appearance: none; background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M1 1l4 4 4-4%27 stroke=%27%2385878c%27 stroke-width=%271.5%27 fill=%27none%27/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 11px center; }
  button:hover, select:hover { background: #2c2d31; }
  button:focus-visible, select:focus-visible, .knob:focus-visible, .cycle:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  header { display: flex; gap: 8px; align-items: center; padding: 12px 16px; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  #play { width: 44px; font-size: 15px; background: var(--acc); color: #111; font-weight: 600; }
  #play:hover { background: #ff9147; }
  #rand { font-weight: 600; }
  .sp { flex: 1; }
  #stat { color: var(--dim); min-width: 120px; text-align: right; }
  #wav { padding: 7px 12px; background: var(--bg3); border-radius: 4px; color: var(--ink); text-decoration: none; cursor: grab; user-select: none; }
  #wav:hover { background: #2c2d31; }
  .flash { animation: flash .6s; }
  @keyframes flash { from { background: #3b3d42; } }

  #view { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 0 16px 8px; }
  #specs { display: grid; gap: 6px; min-width: 0; }
  canvas[hidden] { display: none; }
  .grp.wide { grid-column: span 2; }
  .grp.wide .knobs { grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); }
  canvas { display: block; width: 100%; background: #000; border-radius: 3px; cursor: pointer; }
  #spec { height: 230px; }
  #refspec { height: 150px; }
  #wave { height: 40px; background: var(--bg); }
  #tob { height: 230px; background: var(--bg); cursor: default; }
  #stems { display: flex; gap: 6px; flex-wrap: wrap; min-height: 28px; align-items: center; }
  #stems a { padding: 5px 10px; border-radius: 4px; background: var(--bg3); color: var(--ink); text-decoration: none; font-size: 12px; cursor: grab; user-select: none; }
  #stems a.wait { color: var(--faint); cursor: default; }
  #stems a:hover:not(.wait) { background: #2c2d31; }
  #stems a.playing { background: #3b3d42; }
  #stems .all { background: none; color: var(--dim); cursor: pointer; }
  #drops { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #drops > div { color: var(--dim); background: var(--bg2); padding: 10px 0; text-align: center; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #droplayer, #refname { cursor: pointer; }
  #droplayer:hover, #drop:hover { background: var(--bg3); color: var(--ink); }
  #drop, #droplayer { cursor: pointer; }
  #drops > div.over { background: var(--bg3); color: var(--ink); }
  .grp.empty { display: none; }
  .grp.flash { animation: flash .7s; border-radius: 4px; }
  .x { cursor: pointer; color: var(--faint); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 11px; }
  .legend { display: flex; gap: 12px; color: var(--dim); font-size: 12px; margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 5px; }

  #space { padding: 18px 16px 40px; }
  @media (max-width: 760px) { #space .knobs { grid-template-columns: repeat(4, 1fr); } }
  #scope { display: flex; gap: 22px; padding: 18px 16px 0; }
  #scope button { background: none; padding: 4px 0; border-radius: 0; color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  #scope button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--acc); }
  body.space-only #bank, body.space-only #arch { display: none; }
  .grp[hidden], body.eng-other #scope { display: none; }
  body:not(.space-only) #space { display: none; }
  #space .knobs .knob { width: 56px; height: 56px; } #space .knobs svg { width: 56px; height: 56px; }
  #space .knobs { grid-template-columns: repeat(8, minmax(70px, 110px)); gap: 18px 10px; }
  #saveslot input { font: inherit; color: var(--ink); background: var(--bg3); border: 0; border-radius: 4px; padding: 7px 10px; width: 140px; }
  #refctl button { padding: 3px 8px; font-size: 12px; margin-left: 6px; }
  #refmatch[aria-pressed="true"] { background: #3b3d42; }
  #bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 22px 28px; padding: 18px 16px 40px; }
  .grp h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); display: flex; gap: 10px; align-items: center; }
  .grp h3 span { cursor: pointer; }
  .grp.muted .knobs { opacity: .35; }
  .grp.muted h3 span { text-decoration: line-through; }
  .lock { cursor: pointer; color: var(--faint); font-size: 11px; letter-spacing: 0; text-transform: none; font-weight: 400; }
  .lock.on { color: var(--acc); }
  .knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 12px 6px; }
  .k { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .knob { width: 40px; height: 40px; touch-action: none; cursor: ns-resize; border-radius: 50%; }
  .k .lbl { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; height: 14px; text-align: center; }
  .k.active .lbl { color: var(--ink); }
  .cycle { height: 40px; min-width: 56px; padding: 0 8px; font-size: 12px; border-radius: 4px; background: var(--bg3); display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
  @media (max-width: 760px) {
    .grp.wide { grid-column: auto; }
    #view { grid-template-columns: 1fr; }
    #bank { grid-template-columns: 1fr; }
    #stat { display: none; }
  }
</style>
</head>
<body>
<header>
  <button id="play" aria-label="play">▶</button>
  <select id="arch" aria-label="family"><option>gun</option><option>snare</option><option>ping</option><option>chug</option><option>808</option><option value="fitted" selected>fitted</option></select>
  <button id="rand">randomize</button>
  <button id="mut">mutate</button>
  <button id="back" aria-label="previous">←</button>
  <button id="fwd" aria-label="next">→</button>
  <select id="preset" aria-label="preset"><option value="">init</option><optgroup label="your sounds" id="og-yours"></optgroup><optgroup label="fitted" id="og-fitted"></optgroup><optgroup label="saved" id="og-saved"></optgroup></select>
  <span id="saveslot"><button id="save">save</button></span>
  <button id="del" hidden>delete</button>
  <a id="wav" draggable="true" download="gun.wav" href="#">gun.wav</a>
  <span class="sp"></span>
  <span id="stat">—</span>
</header>
<div id="view">
  <div id="specs">
    <canvas id="spec"></canvas>
    <canvas id="wave"></canvas>
    <div id="stems"></div>
    <canvas id="refspec" hidden></canvas>
    <div id="drops"><div id="droplayer" data-kind="layer" role="button" tabindex="0">+ layer</div><input type="file" id="filelayer" accept="audio/*,.wav,.aif,.aiff,.flac,.mp3,.ogg" hidden><input type="file" id="fileref" accept="audio/*,.wav,.aif,.aiff,.flac,.mp3,.ogg" hidden><div id="drop" data-kind="ref"><span id="refname" role="button" tabindex="0">reference</span><span id="refctl" hidden><button id="refplay">play</button><button id="refmatch" aria-pressed="false">match level</button><button id="reffit">fit</button><button id="refclear">clear</button></span></div></div>
  </div>
  <div>
    <canvas id="tob"></canvas>
    <div class="legend"><span><i style="background:var(--acc)"></i>sound</span><span><i style="background:#777"></i>target</span><span id="refleg" hidden><i style="background:var(--ref)"></i>ref</span></div>
  </div>
</div>
<nav id="scope" role="tablist" aria-label="controls"><button data-s="all" role="tab">synth</button><button data-s="space" role="tab">gun space</button></nav>
<section id="space"><div class="knobs" id="spaceknobs"></div></section>
<div id="bank"></div>
<script type="module" src="app.js"></script>
</body>
</html>
